services:
  - type: web
    name: gravity-duel-online
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: ALLOWED_ORIGINS
        value: https://herald1921.github.io
      - key: MAX_ROOMS
        value: 1
