services:
  - type: web
    name: gravity-duel-online
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server --omit=dev
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: ALLOWED_ORIGINS
        value: https://herald1921.github.io
      - key: MAX_ROOMS
        value: 1000
      - key: MAX_RELAY_ROOMS
        value: 2
      - key: RELAY_DAILY_MB
        value: 32
